{{define "head"}}<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>min-msgr</title>
<style>
:root { color-scheme: light dark; }
body {
	font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
	max-width: 48rem;
	margin: 3rem auto;
	padding: 0 1rem;
	line-height: 1.5;
}
header {
	display: flex;
	flex-wrap: wrap;
	gap: 1rem;
	align-items: center;
	justify-content: space-between;
	margin-bottom: 1.5rem;
}
nav a { margin-right: 1rem; }
.card {
	border: 1px solid #8884;
	border-radius: .75rem;
	padding: 1.25rem;
}
.provider {
	display: block;
	margin: .5rem 0;
	padding: .75rem 1rem;
	border: 1px solid #8886;
	border-radius: .5rem;
	text-decoration: none;
	color: inherit;
}
.provider:hover { background: #8881; }
.error { color: #b00020; }
.muted { opacity: .7; }
button { font: inherit; padding: .4rem .8rem; }
table { width: 100%; border-collapse: collapse; }
th, td { text-align: left; padding: .5rem .4rem; border-bottom: 1px solid #8883; }
code.key {
	display: block;
	padding: .75rem;
	background: #8882;
	border-radius: .5rem;
	word-break: break-all;
	white-space: pre-wrap;
}
.inline { display: inline; }
.limits-form label { margin-right: .5rem; white-space: nowrap; }
.limit-input { width: 9rem; font: inherit; padding: .2rem .4rem; }
.actions { display: flex; flex-wrap: wrap; gap: .5rem; align-items: center; }
.chat-header { margin-bottom: 1rem; }
.messages {
	display: flex;
	flex-direction: column;
	gap: .75rem;
	max-height: 60vh;
	overflow-y: auto;
	padding: .5rem;
	border: 1px solid #8883;
	border-radius: .75rem;
	margin-bottom: 1rem;
}
.message {
	border-left: 3px solid #8884;
	padding: .4rem .75rem;
}
.message-author { font-weight: 600; }
.message-time { margin-left: .5rem; font-size: .85em; opacity: .7; }
.message-body { margin-top: .25rem; overflow-wrap: anywhere; }
.message-body pre { overflow-x: auto; padding: .5rem; background: #8882; border-radius: .4rem; }
.message-body blockquote { margin: .25rem 0; padding-left: .75rem; border-left: 3px solid #8884; }
textarea { width: 100%; box-sizing: border-box; font: inherit; margin: .25rem 0 .5rem; }
</style>
</head>
<body>
{{if .User.ID}}
<header>
	<nav>
		<a href="/">Чаты</a>
		<a href="/keys">Ключи и архивы</a>
		{{if .User.IsAdmin}}<a href="/admin">Админ</a>{{end}}
	</nav>
	<form method="post" action="/logout" class="inline">
		<span class="muted">{{.User.PublicID}}{{if .User.IsAdmin}} (админ){{end}}</span>
		<button type="submit">Выйти</button>
	</form>
</header>
{{end}}
{{end}}

{{define "foot"}}
</body>
</html>
{{end}}
